<!DOCTYPE html>
<html>
<head>
  <title>Borang Kemaskini Data ICT</title>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwZtHriah9ffISYEBGSo9cEg34VdWOeaNAJqgwLhPA5xvcZQAt0WOtNgkanVecm56_f/exec"
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
